name: rh_app
description: RH OCP Custom App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.0.0
  syncfusion_flutter_pdf: ^24.1.41
  intl: ^0.19.0
  excel: ^4.0.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.0
  cupertino_icons: ^1.0.2
  open_file: ^3.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "ocp_logo.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#ffffff"
  image: "presplash.png"
  android_12:
    image: "presplash.png"
    color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    - icon.png
    - ocp_logo.png
    - presplash.png
